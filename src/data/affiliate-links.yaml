# =====================================================================
#  AFFILIATE-LINKS – zentrale Pflege
# =====================================================================
#
#  Hier trägst du alle Partner-Links an EINER Stelle ein.
#  Die Website holt sich die Links automatisch von hier.
#
#  So funktioniert ein Eintrag:
#
#    - id: reifenshop-1            # Kurzname, nur Kleinbuchstaben, Zahlen, Bindestriche.
#                                  # Diesen Namen verwendest du in den Texten.
#      name: "Name des Partners"   # Wird auf der Website angezeigt.
#      url: ""                     # Dein Affiliate-Link (mit https://...).
#                                  # LEER LASSEN = Link wird auf der Website NICHT angezeigt.
#      beschreibung: "..."         # Kurzer, ehrlicher Satz (optional).
#      kategorie: reifen           # reifen | vergleich | zubehoer
#
#  So verwendest du einen Link in einem Markdown-Text:
#
#    [Preise vergleichen](affiliate:vergleich-1)
#
#  Die Website macht daraus automatisch einen Link mit
#  rel="sponsored nofollow" und dem Hinweis „Werbung/Affiliate-Link“.
#
#  Oder am Ende eines Ratgeber-Artikels als dezenter Kasten:
#  Im Kopfbereich (Frontmatter) des Artikels:
#
#    affiliate:
#      - reifenshop-1
#      - vergleich-1
#
#  Solange "url" leer ist, erscheint der Link auf der Live-Seite nicht.
#  In der lokalen Vorschau (npm run dev) siehst du stattdessen einen
#  gestrichelten Platzhalter, damit du weißt, wo später etwas steht.
# =====================================================================

