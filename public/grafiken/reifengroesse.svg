<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" role="img" aria-labelledby="t d">
  <title id="t">Reifengröße 205/55 R16 91V erklärt</title>
  <desc id="d">Die Angabe 205/55 R16 91V auf der Reifenflanke, aufgeteilt in sechs Teile: 1 Breite 205 Millimeter, 2 Querschnitt 55 Prozent, 3 Bauart Radial, 4 Felgendurchmesser 16 Zoll, 5 Tragfähigkeitsindex 91 gleich 615 Kilogramm, 6 Geschwindigkeitsindex V gleich 240 Kilometer pro Stunde.</desc>
  <style>
    .band { fill: #263238; }
    .gross { font: 700 60px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #fff; }
    .nr { font: 700 20px system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #fff; }
    .kreis { fill: #0e5466; }
    .titel { font: 700 25px system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #0a3b48; }
    .text { font: 400 22px system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #37474f; }
    .linie { stroke: #d3dde0; stroke-width: 1.5; }
  </style>
  <rect width="600" height="740" fill="#fff"/>
  <!-- Reifenflanke -->
  <rect class="band" x="16" y="20" width="568" height="120" rx="18"/>
  <path d="M16 46 Q300 10 584 46" fill="none" stroke="#37474f" stroke-width="2"/>
  <g class="gross" text-anchor="middle">
    <text x="102" y="102">205</text>
    <text x="174" y="102">/</text>
    <text x="228" y="102">55</text>
    <text x="318" y="102">R</text>
    <text x="372" y="102">16</text>
    <text x="480" y="102">91</text>
    <text x="534" y="102">V</text>
  </g>
  <!-- Nummern -->
  <g>
    <circle class="kreis" cx="102" cy="172" r="17"/><text class="nr" x="102" y="179" text-anchor="middle">1</text>
    <circle class="kreis" cx="228" cy="172" r="17"/><text class="nr" x="228" y="179" text-anchor="middle">2</text>
    <circle class="kreis" cx="318" cy="172" r="17"/><text class="nr" x="318" y="179" text-anchor="middle">3</text>
    <circle class="kreis" cx="372" cy="172" r="17"/><text class="nr" x="372" y="179" text-anchor="middle">4</text>
    <circle class="kreis" cx="480" cy="172" r="17"/><text class="nr" x="480" y="179" text-anchor="middle">5</text>
    <circle class="kreis" cx="534" cy="172" r="17"/><text class="nr" x="534" y="179" text-anchor="middle">6</text>
  </g>
  <!-- Erklärungen -->
  <g>
    <circle class="kreis" cx="40" cy="240" r="17"/><text class="nr" x="40" y="247" text-anchor="middle">1</text>
    <text class="titel" x="72" y="240">205 = Breite</text>
    <text class="text" x="72" y="270">Der Reifen ist 205 Millimeter breit.</text>
    <line class="linie" x1="24" y1="298" x2="576" y2="298"/>

    <circle class="kreis" cx="40" cy="330" r="17"/><text class="nr" x="40" y="337" text-anchor="middle">2</text>
    <text class="titel" x="72" y="330">55 = Querschnitt</text>
    <text class="text" x="72" y="360">Flanke = 55 % der Breite (hier ca. 11 cm).</text>
    <line class="linie" x1="24" y1="388" x2="576" y2="388"/>

    <circle class="kreis" cx="40" cy="420" r="17"/><text class="nr" x="40" y="427" text-anchor="middle">3</text>
    <text class="titel" x="72" y="420">R = Bauart</text>
    <text class="text" x="72" y="450">Radialreifen – heute bei Autos Standard.</text>
    <line class="linie" x1="24" y1="478" x2="576" y2="478"/>

    <circle class="kreis" cx="40" cy="510" r="17"/><text class="nr" x="40" y="517" text-anchor="middle">4</text>
    <text class="titel" x="72" y="510">16 = Felgengröße</text>
    <text class="text" x="72" y="540">Passt auf 16-Zoll-Felgen (ca. 40,6 cm).</text>
    <line class="linie" x1="24" y1="568" x2="576" y2="568"/>

    <circle class="kreis" cx="40" cy="600" r="17"/><text class="nr" x="40" y="607" text-anchor="middle">5</text>
    <text class="titel" x="72" y="600">91 = Tragfähigkeit</text>
    <text class="text" x="72" y="630">Bis zu 615 kg pro Reifen.</text>
    <line class="linie" x1="24" y1="658" x2="576" y2="658"/>

    <circle class="kreis" cx="40" cy="690" r="17"/><text class="nr" x="40" y="697" text-anchor="middle">6</text>
    <text class="titel" x="72" y="690">V = Höchstgeschwindigkeit</text>
    <text class="text" x="72" y="720">Zugelassen bis 240 km/h.</text>
  </g>
</svg>
